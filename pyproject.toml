[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lingframe"
version = "1.0.0"
description = "Computational Rhetoric Platform for Linguistic Atomization"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "LingFrame Contributors" }
]
keywords = ["linguistics", "rhetoric", "atomization", "nlp", "text-analysis", "computational-rhetoric"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "numpy>=2.0.0",
    "scikit-learn>=1.0.0",
    "pyyaml>=6.0",
    "spacy>=3.0.0",
    "vaderSentiment>=3.3.2",
    "textblob>=0.17.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "pdfplumber>=0.10.0",
    "PyMuPDF>=1.20.0",
    "tqdm>=4.60.0",
    "streamlit>=1.30.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
]

[project.scripts]
lingframe = "cli.main:main"

[project.urls]
Homepage = "https://github.com/organvm-i-theoria/linguistic-atomization-framework"
Repository = "https://github.com/organvm-i-theoria/linguistic-atomization-framework.git"
"Bug Tracker" = "https://github.com/organvm-i-theoria/linguistic-atomization-framework/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["framework*", "cli*", "app*"]

[tool.setuptools.package-data]
framework = ["domains/*/*", "schemas/*.yaml"]
templates = ["*.html"]
projects = ["*", "*/*", "*/*/*"]
